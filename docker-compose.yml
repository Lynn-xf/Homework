services:
  ollama1:
    image: ollama/ollama:latest
    container_name: ollama1
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama   # persist models

  ollama2:
    image: ollama/ollama:latest
    container_name: ollama2
    ports:
      - "11435:11434" # map container 11434 to host 11435
    volumes:
      - ollama_models:/root/.ollama   # persist models

  app:
    build: .
    restart: always
    environment:
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: 172.31.120.176
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 3306
      HARVARD_API_KEY: ${HARVARD_API_KEY}
    ports:
      - "80:3000"
      - "${PORT}:3000"
    volumes:
      - ./src/utils/images:/usr/src/app/src/utils/images
    depends_on:
      - ollama1
      - ollama2

volumes:
  ollama_models:


